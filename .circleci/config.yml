version: 2.1

parameters:
  repository-name:
    type: string
    default: "evonove-it"
  image-name:
    type: string
    default: "evonove-it-backend"
  path:
    default: ~/.local/bin
    description: Path of where Trivy is install
    type: string

orbs:
  python: circleci/python@3.1.0
  gcp-gcr: circleci/gcp-gcr@0.16.10

executors:
  builder:
    docker:
      - image: cimg/python:3.13.3

commands:
  set-image-tag-env-var:
    steps:
      - run:
          name: Set IMAGE_TAG environment variable
          command: bash .circleci/scripts/set-image-tag.sh

workflows:
  test_build_push:
    jobs:
      - test:
          filters:
            tags:
              only: /.*/
      - semgrep-ci:
          requires:
            - test
          filters:
            tags:
              only: /.*/
      - pa11y-ci:
          requires:
            - test
          filters:
            tags:
              only: /.*/
      - build-and-push:
          context:
            - google-cloud-platform
          requires:
            - test
          filters:
            tags:
              only: /.*/
      - trivy-scan:
          context:
            - google-cloud-platform
          requires:
            - build-and-push
          filters:
            tags:
              only: /.*/

jobs:
  test:
    docker:
      - image: cimg/python:3.13.3
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
      - image: cimg/postgres:17.4
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          POSTGRES_DB: evonoveit
          POSTGRES_USER: devel
          POSTGRES_PASSWORD: 123456
      - image: cimg/redis:7.2.3
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Formatter check
          command: uv run ruff format --exclude migrations --check django-website
      - run:
          name: Linter check
          command: uv run ruff check django-website
      - run:
          name: Migrations check
          environment:
            DJANGO_SETTINGS_MODULE: website.settings
          command: uv run python django-website/manage.py makemigrations --check --dry-run
      - run:
          name: Run tests
          environment:
            DJANGO_SETTINGS_MODULE: website.settings
          command: |
            mkdir test-results
            uv run python runtests.py \
                --cov django-website \
                --cov-report html:htmlcov \
                --junitxml=test-results/junit.xml \
                django-website/
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: htmlcov

  semgrep-ci:
    docker:
      - image: cimg/python:3.13.3
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Semgrep scan
          command: |
            mkdir test-scans
            uv run semgrep scan --config auto --output scan-results/scan_results.json --json --error
      - store_artifacts:
          path: scan-results/scan_results.json
          destination: scan-results

  pa11y-ci:
    docker:
      - image: cimg/python:3.13.3-browsers
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
      - image: cimg/postgres:17.4
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          POSTGRES_DB: evonoveit
          POSTGRES_USER: devel
          POSTGRES_PASSWORD: 123456
      - image: cimg/redis:7.2.3
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Init DB and run pa11y-ci
          environment:
            DJANGO_SETTINGS_MODULE: website.settings
            RESULTS_DIR: a11y-results
          command: |
            chmod +x ./runpa11y.sh
            ./runpa11y.sh
      - store_artifacts:
          path: a11y-results

  build-and-push:
    executor: builder
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - gcp-gcr/gcr-auth:
          gcloud-service-key: CLEARTEXT_GCLOUD_SERVICE_KEY
          registry-url: europe-west3-docker.pkg.dev
      - set-image-tag-env-var
      - gcp-gcr/build-image:
          image: << pipeline.parameters.repository-name >>/<< pipeline.parameters.image-name >>
          tag: $IMAGE_TAG
          dockerfile: containers/Dockerfile
          registry-url: europe-west3-docker.pkg.dev
      - gcp-gcr/push-image:
          image: << pipeline.parameters.repository-name >>/<< pipeline.parameters.image-name >>
          tag: $IMAGE_TAG
          registry-url: europe-west3-docker.pkg.dev

  trivy-scan:
    docker:
      - image: cimg/base:current
    steps:
      - gcp-gcr/gcr-auth:
          gcloud-service-key: CLEARTEXT_GCLOUD_SERVICE_KEY
          registry-url: europe-west3-docker.pkg.dev
      - set-image-tag-env-var
      - run:
          name: Install Trivy and run image scan
          command: |
            export TRIVY_BIN_DIR=<< pipeline.parameters.path>>/trivy-bin
            echo $CLEARTEXT_GCLOUD_SERVICE_KEY > /tmp/service.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service.json
            export TRIVY_USERNAME=""
            export TRIVY_PASSWORD=""
            export TRIVY_AUTH_URL=""
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b .
            ./trivy image --format json --output trivy-result.json \
            --severity HIGH,CRITICAL --scanners vuln,misconfig,secret --ignore-unfixed \
            --exit-code 1 \
            europe-west3-docker.pkg.dev/$GOOGLE_PROJECT_ID/<< pipeline.parameters.repository-name >>/<< pipeline.parameters.image-name >>:$IMAGE_TAG
      - store_artifacts:
          path: trivy-result.json
          destination: trivy-results
